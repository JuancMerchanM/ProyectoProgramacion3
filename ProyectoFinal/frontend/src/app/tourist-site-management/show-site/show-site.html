<div class="container">
    @if(markbook){
    <img [src]="markbook.image" alt="Imagen">
    <div class="two-columns mb-3">
        <span class="title">{{markbook.name}}</span>
        <span class="normal-text">{{markbook.category}}</span>
    </div>
    <span class="mb-6">
        Municipio {{ markbook.town }}
        @if (markbook.lastPoint != 0) {
        <br>Distancia a último punto: {{ markbook.lastPoint }} km
        }
    </span>
    <p class="mb-6">{{markbook.description}}</p>
    <span class="title mb-6" style="font-size: 15px;">Rutas que podrian interesarte</span>
    <app-list-routes [routes]="[{ name: 'Ruta del Café Boyacense', date: '2025-03-21', privacy: 'Pública', distance: 125, spots: 8 },
      { name: 'Aventura en la Sierra Nevada', date: '2025-04-10', privacy: 'Privada', distance: 312, spots: 12 },
      { name: 'Tour por los Pueblos Patrimonio', date: '2025-05-02', privacy: 'Pública', distance: 450, spots: 15 },
      { name: 'Ruta Ecológica del Cocuy', date: '2025-06-15', privacy: 'Privada', distance: 210, spots: 9 },
      { name: 'Costa Caribe Express', date: '2025-07-08', privacy: 'Pública', distance: 580, spots: 11 }]" />
    <div class="two-columns">
        <span class="title" style="font-size: 15px;">Puntuacion</span>
        <div class="markbook-rating">
            <span class="stars">★★★★★</span>
            <span class="stars filled" [style.width.%]="markbook.rating">★★★★★</span>
        </div>
    </div>
    }@else {
    <span>NO DATA</span>
    }
</div>
