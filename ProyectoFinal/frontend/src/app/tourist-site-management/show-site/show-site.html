<div class="container">
    @if(point){
    <img [src]="point.image" alt="Imagen">
    <div class="two-columns mb-3">
        <span class="title">{{point.name}}</span>
        <span class="normal-text">{{point.category}}</span>
    </div>
    <span class="mb-6 p-left-15">
        Municipio {{ point.municipality }}
        <!-- @if (point.lastPoint != 0) {
        <br>Distancia a último punto: {{ point.lastPoint }} km
        } -->
    </span>
    <span class="title mb-6 p-left-15" style="font-size: 15px;">Rutas que podrian interesarte</span>
    <app-list-routes class="routes-scroll p-left-15" [routes]="[{ name: 'Ruta del Café Boyacense', date: '2025-03-21', privacy: 'Pública', distance: 125, spots: 8 },
      { name: 'Aventura en la Sierra Nevada', date: '2025-04-10', privacy: 'Privada', distance: 312, spots: 12 },
      { name: 'Tour por los Pueblos Patrimonio', date: '2025-05-02', privacy: 'Pública', distance: 450, spots: 15 },
      { name: 'Ruta Ecológica del Cocuy', date: '2025-06-15', privacy: 'Privada', distance: 210, spots: 9 },
      { name: 'Costa Caribe Express', date: '2025-07-08', privacy: 'Pública', distance: 580, spots: 11 }]" />
    <div class="two-columns">
        <span class="title" style="font-size: 15px;">Puntuacion</span>
        <div class="point-rating p-left-15">
            <span class="stars">★★★★★</span>
            <span class="stars filled" [style.width.%]="point.rating">★★★★★</span>
        </div>
        <app-rating-component [rating]="point.rating"/>
    </div>
    }@else {
    <span>NO DATA</span>
    }
</div>
