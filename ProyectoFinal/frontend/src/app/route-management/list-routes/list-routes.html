<div class="ruta-card">
  <div class="left">
    <div class="title">Ruta {{ name }}</div>

    <div class="sub-info">
      <span>{{ date }}</span>
      <span class="dot">•</span>
      <span>{{ privacy }}</span>
    </div>
  </div>

  <div class="center">
    <div>Distancia: {{ distance }} km</div>
    <div>{{ spots }} Lugares</div>
  </div>

  <div class="right">
    <img src="eye-icon.png" alt="ver" class="eye-icon" />
  </div>
</div>
