<div class="input-field">
  <input
    [type]="type"
    [name]="name"
    [id]="id"
    [required]="required"
    [autocomplete]="autocomplete"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    (input)="onInputChange($event)"
    (blur)="onBlur()"
  />
  <label [for]="id">{{ label }}</label>
</div>
