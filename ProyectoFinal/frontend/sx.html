<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa de Boyacá</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- ✅ Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ✅ Turf.js (necesario para polygon(), difference(), etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    var map = L.map('map').setView([5.5, -73.4], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var start = [5.535, -73.367]; // Tunja
    var end = [5.634, -75.523];   // Villa de Leyva

    L.marker(start).addTo(map).bindPopup("Inicio: Tunja");
    L.marker(end).addTo(map).bindPopup("Destino: Villa de Leyva");

    var url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data.routes && data.routes.length > 0) {
          console.log(data.routes.length)
          var route = data.routes[0].geometry;

          console.log(route);

          // Dibujar la línea del recorrido
          var routeLine = L.geoJSON(route, {
            style: {
              color: 'blue',
              weight: 4,
              opacity: 0.8
            }
          }).addTo(map);

          // Ajustar el zoom para ver toda la ruta
          map.fitBounds(routeLine.getBounds());
        } else {
          alert("No se encontró ruta.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Error al obtener la ruta");
      });
  </script>
</body>
</html>
