<div class="container">
    <img src="Logo.png" class="avatar" style="align-self: center; margin-bottom: 22px;">
    <span style="align-self: center; margin-bottom: 22px;">{{username}}</span>
    <app-input-box label="Correo" [(value)]="email" />
    <app-input-box label="Contraseña" [value]="password" />

    <button class="button" (click)="manageAccount.emit()">Gestionar cuenta</button>
</div>
