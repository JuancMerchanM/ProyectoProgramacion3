<div class="route-card">
  <div class="left">
    <div class="title">Ruta {{ simpleRoute.name }}</div>

    <div class="sub-info">
      <span>{{ simpleRoute.date }}</span>
      <span class="dot">•</span>
      <span>{{ simpleRoute.privacy }}</span>
    </div>
  </div>

  <div class="center">
    <div>Distancia: {{ simpleRoute.distance }} km</div>
    <div>{{ simpleRoute.spots }} Lugares</div>
  </div>

  <div class="right">
    <img src="eye-icon.png" alt="ver" class="eye-icon" />
  </div>
</div>
