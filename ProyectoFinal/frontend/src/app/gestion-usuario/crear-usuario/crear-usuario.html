<div class="container">
    <p class="signin">Already have an account? <a href="#" (click)="onGoToLogin($event)">Login!</a></p>
    <form class="form" #form="ngForm">
        <app-input-field [(ngModel)]="user.email" #emailField="ngModel" label="Email" id="email" name="email" type="email" [required]="true"/>
        <app-input-field [(ngModel)]="user.username" #nameField="ngModel" label="Username" id="username" name="username" [required]="true"/>
        <app-input-field [(ngModel)]="user.password" #passwordField="ngModel" label="Password" id="password" name="password" type="password" [required]="true"/>
        <app-input-field [(ngModel)]="confirmPassword" label="Confirm password" id="conf-password" name="conf-password" type="password"
            [required]="true" />

        <app-animated-button text="Sign in" [attr.disabled]="form.invalid ? true : null" (clicked)="onSubmit(form)"></app-animated-button>
    </form>
</div>
