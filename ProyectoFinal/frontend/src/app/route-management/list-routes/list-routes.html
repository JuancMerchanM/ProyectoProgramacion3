<div class="routes-list">
  @for (route of routes; track $index) {
    <div class="route-item">
      <div class="route-main">
        <div class="route-title-section">
          <h3 class="route-title">Ruta {{ route.name }}</h3>
          <p class="route-date-privacy">{{ route.date }} • {{ route.privacy }}</p>
        </div>

        <div class="route-stats">
          <div class="stat-item">
            <span class="stat-label">Distancia:</span>
            <span class="stat-value">{{ route.distance }} km</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">{{ route.spots }} Lugares</span>
          </div>
        </div>
      </div>

      <div class="route-actions">
        <button class="action-btn view-btn" (click)="onAction('view', route)" title="Ver ruta">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <button class="action-btn publish-btn" (click)="onAction('publish', route)" title="Publicar ruta">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>

        <button class="action-btn edit-btn" (click)="onAction('edit', route)" title="Editar ruta">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>

        <button class="action-btn delete-btn" (click)="onAction('delete', route)" title="Eliminar ruta">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
