<div class="container">
    <p class="title">Crear cuenta</p>
    <form class="form">
        <app-input-field label="Email" id="email" name="email" type="email" [required]="true" />
        <app-input-field label="Username" id="username" name="username" [required]="true" />
        <app-input-field label="Date of birth" id="dateBirth" name="dateBirth" type="date" />
        <app-input-field label="Password" id="password" name="password" type="password" [required]="true" />
        <app-input-field label="Confirm password" id="conf-password" name="conf-password" type="password"
            [required]="true" />

        <app-animated-button text="E N T R Y"></app-animated-button>
    </form>
</div>
