<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Mapa de Boyacá</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- ✅ Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ✅ Turf.js (necesario para polygon(), difference(), etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    var map = L.map('map', { zoomDelta: 0.5, zoomSnap: 0.5 }).setView([5.668770910764556, -72.99409501913873], 8.5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      minZoom: 8.5,
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch('Boyaca_4326.geojson')
      .then(response => response.json())
      .then(data => {
        console.log(data);
        const myPolygon = L.geoJSON(data, {
          style: {
            color: 'red',        // borde del polígono
            weight: 2,           // grosor del borde
            fillColor: 'orange', // color interno
            fillOpacity: 0.3     // transparencia del interior
          }
        }).addTo(map);

        const bounds = myPolygon.getBounds();
        map.fitBounds(bounds);
        console.log(map.getBoundsZoom(bounds));
        map.setMinZoom(map.getBoundsZoom(bounds));
        map.setMaxBounds(bounds.pad(0.05)); // padding opcional para evitar rebotes
      });

    var start = [4.764052979916138, -73.32550128202898]; // Tunja
    var end = [7.002248519906628, -72.10825034210478];   // Villa de Leyva

    L.marker(start).addTo(map).bindPopup("Inicio: MAMBITA");
    L.marker(end).addTo(map).bindPopup("Destino: CUBARA");

    var url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data.routes && data.routes.length > 0) {
          console.log(data.routes.length)
          var route = data.routes[0].geometry;

          console.log(route);

          // Dibujar la línea del recorrido
          var routeLine = L.geoJSON(route, {
            style: {
              color: 'blue',
              weight: 4,
              opacity: 0.8
            }
          }).addTo(map);

          // Ajustar el zoom para ver toda la ruta
          map.fitBounds(routeLine.getBounds());
        } else {
          alert("No se encontró ruta.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Error al obtener la ruta");
      });




  </script>
</body>

</html>
