<div class="create-route-container">
  <h2>🗺️ Crear Nueva Ruta</h2>
  
  <div class="form-group">
    <label>Nombre de la ruta:</label>
    <input 
      type="text" 
      [(ngModel)]="routeName" 
      placeholder="Ej: Ruta del Café Boyacense"
      [disabled]="isLoading">
  </div>

  <div class="form-group">
    <label>📍 Origen:</label>
    <select [(ngModel)]="selectedOrigin" [disabled]="isLoading">
      <option value="">Seleccione un origen</option>
      <option *ngFor="let loc of locations" [value]="loc.id">
        {{loc.name}} - {{loc.municipality}}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>🎯 Destino:</label>
    <select [(ngModel)]="selectedDestination" [disabled]="isLoading">
      <option value="">Seleccione un destino</option>
      <option *ngFor="let loc of locations" [value]="loc.id">
        {{loc.name}} - {{loc.municipality}}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>🚩 Puntos intermedios (opcional):</label>
    <div class="waypoints">
      <div *ngFor="let wp of waypoints; let i = index" class="waypoint-item">
        <select [(ngModel)]="waypoints[i]" [disabled]="isLoading">
          <option value="">Seleccione un punto</option>
          <option *ngFor="let loc of locations" [value]="loc.id">
            {{loc.name}} - {{loc.municipality}}
          </option>
        </select>
        <button 
          type="button" 
          (click)="removeWaypoint(i)" 
          class="btn-remove"
          [disabled]="isLoading">
          ✕
        </button>
      </div>
    </div>
    <button 
      type="button" 
      (click)="addWaypoint()" 
      class="btn-add"
      [disabled]="isLoading">
      ➕ Agregar punto intermedio
    </button>
  </div>

  <div class="actions">
    <button 
      (click)="previewRoute()" 
      [disabled]="!canPreview() || isLoading" 
      class="btn-preview">
      {{ isLoading ? '⏳ Calculando...' : '👁️ Vista Previa' }}
    </button>
    <button 
      (click)="saveRoute()" 
      [disabled]="!canSave() || isLoading" 
      class="btn-save">
      💾 Guardar Ruta
    </button>
  </div>

  <div *ngIf="routeInfo" class="route-info">
    <div class="info-header">
      <h3>📊 Información de la Ruta</h3>
      <button (click)="clearRoute()" class="btn-clear">🗑️ Limpiar</button>
    </div>
    <div class="info-content">
      <div class="info-item">
        <span class="label">📏 Distancia:</span>
        <span class="value">{{(routeInfo.distance / 1000).toFixed(2)}} km</span>
      </div>
      <div class="info-item">
        <span class="label">⏱️ Duración estimada:</span>
        <span class="value">{{formatDuration(routeInfo.duration)}}</span>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="error-message">
    ⚠️ {{error}}
  </div>

  <div *ngIf="locations.length === 0 && !error" class="info-message">
    ℹ️ Cargando ubicaciones disponibles...
  </div>
</div>
