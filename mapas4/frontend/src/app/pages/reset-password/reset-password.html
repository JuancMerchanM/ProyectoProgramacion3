<div class="reset-container">
  <div class="reset-card">

    <div class="left-section">
      <img src="Logo.png" alt="Logo Boyacá Viva" />
    </div>

    <div class="right-section">
      <h2>Cambia tu contraseña</h2>

      <app-input-field
        label="Nueva contraseña"
        type="password"
        name="newPassword"
        id="newPassword"
        [required]="true"
        [(ngModel)]="newPassword"
        (ngModelChange)="validatePassword()"
      />

      <app-input-field
        label="Confirmar contraseña"
        type="password"
        name="confirmPassword"
        id="confirmPassword"
        [required]="true"
        [(ngModel)]="confirmPassword"
      />

      <!-- Caja de reglas -->
      <div class="rules">
        <p><strong>Tu contraseña debe tener:</strong></p>

        <ul>
          <li [class.ok]="rules.minLength" [class.bad]="!rules.minLength">
            <i class="bi" [ngClass]="rules.minLength ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
            Al menos 8 caracteres
          </li>

          <li [class.ok]="rules.number" [class.bad]="!rules.number">
            <i class="bi" [ngClass]="rules.number ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
            Un número
          </li>

          <li [class.ok]="rules.special" [class.bad]="!rules.special">
            <i class="bi" [ngClass]="rules.special ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
            Un caracter especial
          </li>
        </ul>
      </div>

      <button class="btn" (click)="resetPassword()" [disabled]="!canSubmit()">
        Restablecer contraseña
      </button>

    </div>

  </div>
</div>
